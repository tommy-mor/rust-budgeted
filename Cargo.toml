[package]
name = "cargo-fuzz-next"
version = "0.1.0"
edition = "2021"
description = "Nextest-slice test runner for joint-fuzz style workspaces: shared core budget across worktrees, timing JSONL estimates, timeouts, retries, JUnit."
license = "MIT"
readme = "README.md"

[lib]
name = "cargo_fuzz_next"
path = "src/lib.rs"

[[bin]]
name = "cargo-fuzz-next"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "6"
fs2 = "0.4"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["process", "signal"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
